<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app-container">
    <header class="section section--balance">
      <div class="header-top">
        <h1>Expense &amp; Budget Visualizer</h1>
        <button id="btn-theme-toggle" class="btn-theme" aria-label="Toggle dark mode">🌙</button>
      </div>
      <div class="balance-display">
        <span class="balance-label">Total Balance</span>
        <span id="total-balance" class="balance-amount">Rp 0</span>
      </div>
    </header>

    <main>
      <section class="section section--form" aria-labelledby="form-heading">
        <h2 id="form-heading">Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              placeholder="e.g. Lunch"
              autocomplete="off"
            />
            <span class="error-msg" id="error-name" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="item-amount">Amount</label>
            <input
              type="number"
              id="item-amount"
              name="item-amount"
              placeholder="e.g. 35000"
              min="0.01"
              step="any"
            />
            <span class="error-msg" id="error-amount" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="item-category">Category</label>
            <select id="item-category" name="item-category">
              <option value="">-- Select a category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span class="error-msg" id="error-category" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-group form-group--add-category">
            <label for="new-category">Add Custom Category</label>
            <div class="add-category-row">
              <input type="text" id="new-category" placeholder="e.g. Health" autocomplete="off" />
              <button type="button" id="btn-add-category" class="btn-secondary">+ Add</button>
            </div>
            <span class="error-msg" id="error-new-category" role="alert" aria-live="polite"></span>
          </div>

          <button type="submit" class="btn-submit">Add Transaction</button>
        </form>
      </section>

      <section class="section section--list" aria-labelledby="list-heading">
        <h2 id="list-heading">Transaction History</h2>
        <div class="sort-controls">
          <label for="sort-select">Sort by:</label>
          <select id="sort-select">
            <option value="none">Default (newest first)</option>
            <option value="amount-desc">Amount (high to low)</option>
            <option value="amount-asc">Amount (low to high)</option>
            <option value="category-asc">Category (A–Z)</option>
            <option value="category-desc">Category (Z–A)</option>
          </select>
        </div>
        <ul id="transaction-list" aria-label="Transaction list">
          <!-- Transactions rendered here by app.js -->
        </ul>
      </section>

      <section class="section section--chart" aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending by Category</h2>
        <div class="chart-wrapper">
          <canvas id="expense-chart" aria-label="Pie chart of spending by category" role="img"></canvas>
        </div>
      </section>
    </main>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Application logic -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
